<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="playerBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="coneOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="playerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#playerBgGrad)" filter="url(#playerShadow)"/>
  <rect x="9.5" y="9.5" width="101" height="101" rx="24.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Soundwave Frequency Rings on Sides -->
  <path d="M22 45 A 28 28 0 0 0 22 75" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M16 38 A 38 38 0 0 0 16 82" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  
  <path d="M98 45 A 28 28 0 0 1 98 75" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M104 38 A 38 38 0 0 1 104 82" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- The Iconic VLC Cone -->
  <g filter="url(#playerShadow)">
    <!-- Base Plate -->
    <ellipse cx="60" cy="94" rx="36" ry="9" fill="#c2410c"/>
    <ellipse cx="60" cy="92" rx="34" ry="8" fill="url(#coneOrange)"/>

    <!-- Bottom Orange Tier -->
    <path d="M34 89 L40 76 L80 76 L86 89 Z" fill="url(#coneOrange)"/>
    
    <!-- White Stripe 1 -->
    <path d="M40 76 L44 64 L76 64 L80 76 Z" fill="#ffffff"/>
    
    <!-- Middle Orange Tier -->
    <path d="M44 64 L48 52 L72 52 L76 64 Z" fill="url(#coneOrange)"/>

    <!-- White Stripe 2 -->
    <path d="M48 52 L52 40 L68 40 L72 52 Z" fill="#ffffff"/>

    <!-- Top Orange Cap -->
    <path d="M52 40 L57 26 C57.5 24.5 62.5 24.5 63 26 L68 40 Z" fill="url(#coneOrange)"/>
    <ellipse cx="60" cy="26" rx="4" ry="2" fill="#fdba74"/>
  </g>

  <!-- Glowing Play Emblem Triangle overlay in center -->
  <circle cx="60" cy="66" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#playerShadow)"/>
  <polygon points="56,58 68,66 56,74" fill="#38bdf8"/>
</svg>
