<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="comptaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#comptaGrad)"/>
  <!-- Ledger Book Outline -->
  <rect x="22" y="22" width="56" height="56" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="3"/>
  <!-- Central Ledger Spine -->
  <line x1="50" y1="22" x2="50" y2="78" stroke="#34d399" stroke-width="2" stroke-dasharray="2 2"/>
  <!-- T-Account Balance Lines -->
  <!-- Left Debit Lines -->
  <line x1="28" y1="36" x2="44" y2="36" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="46" x2="40" y2="46" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="56" x2="44" y2="56" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right Credit Lines -->
  <line x1="56" y1="36" x2="72" y2="36" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="46" x2="68" y2="46" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="56" x2="72" y2="56" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Balance scale symbol / SCF badge at bottom -->
  <circle cx="50" cy="68" r="4" fill="#fbbf24"/>
</svg>
