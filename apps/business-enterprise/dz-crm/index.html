<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DZ-CRM | نظام إدارة علاقات العملاء والصفقات السيادي (بديل Salesforce & HubSpot)</title>
  <meta name="description" content="منصة متقدمة وسيادية لإدارة علاقات العملاء والشركات والصفقات التجارية لرواد الأعمال والمؤسسات الجزائرية. حساب بالدينار الجزائري DZD، ربط بالولايات الـ 58، وتخزين محلي 100% دون خوادم سحابية." />
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="DZ-CRM" />
  <link rel="icon" href="./favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <!-- Sovereign Offline DZ Runtime Styles & Cairo Typography -->
  <link rel="stylesheet" href="../../../packages/dz-runtime/dz-runtime.css" />
  <link rel="stylesheet" href="./src/styles/index.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" />
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (() => {
      try {
        const t = localStorage.getItem('crm:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    })();
  </script>
  <!-- Native browser Import Map for offline vendored packages -->
  <script type="importmap">
  {
    "imports": {
      "lucide": "../../../packages/vendor/lucide.js"
    }
  }
  </script>
  <!-- Sovereign DZ Runtime (100% Local, zero telemetry) -->
  <script src="../../../packages/dz-runtime/dz-runtime.js"></script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <div id="app" class="app">
    <div class="boot-splash" aria-hidden="true">
      <img class="boot-mark" src="./icon-192.png" width="56" height="56" alt="" />
    </div>
  </div>
</body>
</html>
