<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DZ-Signature | منظومة التوقيع والتأشير الرقمي الجزائري</title>
  <meta name="description" content="توقيع وتأشير الوثائق والمستندات الرسمية، إضافة الأختام الجمهورية، والتحقق من التوقيعات محلياً 100% دون خوادم خارجية." />
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="DZ-Signature" />
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="./favicon-48x48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="../../../packages/dz-runtime/dz-runtime.css" />
  <link rel="stylesheet" href="./src/styles/index.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (() => {
      try {
        const t = localStorage.getItem('signatures:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    })();
  </script>
  <script src="../../../packages/dz-runtime/dz-runtime.js"></script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <div id="app" class="app">
    <div class="boot-splash" aria-hidden="true">
      <img src="./app-icon.png" alt="" width="64" height="64" draggable="false" />
    </div>
  </div>
</body>
</html>
