<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGradCalc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="gridBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="goldGradCalc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="crimsonRedCalc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadowFilterCalc" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#shieldGradCalc)" filter="url(#shadowFilterCalc)" stroke="#34d399" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Subtle Geometric Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="24" y1="120" x2="488" y2="120" />
    <line x1="24" y1="200" x2="488" y2="200" />
    <line x1="24" y1="280" x2="488" y2="280" />
    <line x1="24" y1="360" x2="488" y2="360" />
    <line x1="120" y1="24" x2="120" y2="488" />
    <line x1="200" y1="24" x2="200" y2="488" />
    <line x1="280" y1="24" x2="280" y2="488" />
    <line x1="360" y1="24" x2="360" y2="488" />
  </g>

  <!-- Spreadsheet Grid Plaque -->
  <g filter="url(#shadowFilterCalc)">
    <rect x="100" y="100" width="312" height="312" rx="20" fill="url(#gridBgGrad)" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Grid Header Row -->
    <path d="M 100 120 A 20 20 0 0 1 120 100 L 392 100 A 20 20 0 0 1 412 120 L 412 148 L 100 148 Z" fill="#047857"/>
    
    <!-- Grid Column Separators in Header -->
    <line x1="150" y1="100" x2="150" y2="148" stroke="#065f46" stroke-width="2"/>
    <line x1="238" y1="100" x2="238" y2="148" stroke="#065f46" stroke-width="2"/>
    <line x1="326" y1="100" x2="326" y2="148" stroke="#065f46" stroke-width="2"/>

    <!-- Column Letters in Header -->
    <text x="125" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
    <text x="194" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
    <text x="282" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
    <text x="370" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>

    <!-- Grid Lines (Horizontal) -->
    <line x1="100" y1="196" x2="412" y2="196" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="100" y1="244" x2="412" y2="244" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="100" y1="292" x2="412" y2="292" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="100" y1="340" x2="412" y2="340" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Grid Lines (Vertical) -->
    <line x1="150" y1="148" x2="150" y2="412" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="238" y1="148" x2="238" y2="412" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="326" y1="148" x2="326" y2="412" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Row Numbers in Left Column -->
    <text x="125" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">1</text>
    <text x="125" y="226" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">2</text>
    <text x="125" y="274" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">3</text>
    <text x="125" y="322" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">4</text>
    <text x="125" y="378" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">5</text>

    <!-- Active Selection Box (B2) with handles -->
    <rect x="150" y="196" width="88" height="48" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="3"/>
    <rect x="234" y="240" width="8" height="8" fill="#047857"/>
  </g>

  <!-- Growth Bar Chart Overlapping at Bottom Right -->
  <g transform="translate(240, 260)">
    <!-- Bar 1 -->
    <rect x="16" y="70" width="24" height="60" rx="4" fill="url(#barGrad1)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Bar 2 -->
    <rect x="48" y="35" width="24" height="95" rx="4" fill="url(#barGrad2)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Bar 3 -->
    <rect x="80" y="10" width="24" height="120" rx="4" fill="url(#barGrad3)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Rising Trend Line -->
    <path d="M 28 65 L 60 30 L 92 5" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="92" cy="5" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Sigma / Sum Symbol (Σ) Badge at Top Right of Grid -->
  <g transform="translate(372, 72)">
    <circle cx="28" cy="28" r="32" fill="url(#goldGradCalc)" stroke="#ffffff" stroke-width="3" filter="url(#shadowFilterCalc)"/>
    <text x="28" y="38" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">Σ</text>
  </g>

  <!-- "X" Spreadsheet Identifier Badge at top-left -->
  <g transform="translate(86, 76)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#047857" stroke="#ffffff" stroke-width="3" filter="url(#shadowFilterCalc)"/>
    <text x="28" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">X</text>
  </g>

  <!-- Algerian Emblem at Bottom Left (Crescent & Star) -->
  <g transform="translate(86, 386) scale(0.68)">
    <circle cx="0" cy="0" r="38" fill="url(#goldGradCalc)" stroke="#ffffff" stroke-width="3" filter="url(#shadowFilterCalc)"/>
    <circle cx="0" cy="0" r="32" fill="#065f46"/>
    <!-- Crescent -->
    <path d="M 10 -16 A 18 18 0 1 0 10 16 A 14 14 0 1 1 10 -16 Z" fill="url(#crimsonRedCalc)"/>
    <!-- Star -->
    <polygon points="12,-5 14,-1 18,-1 15,2 16,6 12,3 8,6 9,2 6,-1 10,-1" fill="url(#crimsonRedCalc)"/>
  </g>
</svg>
