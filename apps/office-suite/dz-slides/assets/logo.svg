<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGradSlides" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="goldGradSlides" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="crimsonRedSlides" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="slideInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowFilterSlides" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c2d12" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#shieldGradSlides)" filter="url(#shadowFilterSlides)" stroke="#fb923c" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Subtle Dynamic Rays Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="256" y1="24" x2="256" y2="488" />
    <line x1="24" y1="256" x2="488" y2="256" />
    <line x1="92" y1="92" x2="420" y2="420" />
    <line x1="92" y1="420" x2="420" y2="92" />
  </g>

  <!-- Projection Screen Easel Stand Legs -->
  <g stroke="#fed7aa" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="360" x2="180" y2="440" />
    <line x1="256" y1="360" x2="332" y2="440" />
    <line x1="256" y1="360" x2="256" y2="450" />
  </g>

  <!-- Presentation 16:9 Screen Display -->
  <g filter="url(#shadowFilterSlides)">
    <!-- Outer screen frame -->
    <rect x="90" y="110" width="332" height="230" rx="16" fill="#1e293b" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Screen canvas -->
    <rect x="104" y="124" width="304" height="202" rx="10" fill="url(#slideInnerGrad)"/>

    <!-- Slide Header Content -->
    <rect x="124" y="142" width="140" height="12" rx="6" fill="#38bdf8"/>
    <rect x="124" y="162" width="90" height="8" rx="4" fill="#94a3b8"/>

    <!-- Visual Presentation Elements Inside Screen -->
    <!-- Bar 1 -->
    <rect x="130" y="235" width="22" height="60" rx="4" fill="#10b981"/>
    <!-- Bar 2 -->
    <rect x="160" y="210" width="22" height="85" rx="4" fill="#f59e0b"/>
    <!-- Bar 3 -->
    <rect x="190" y="185" width="22" height="110" rx="4" fill="#3b82f6"/>

    <!-- Pie Chart Graphic on Right Side of Screen -->
    <g transform="translate(320, 240)">
      <!-- Pie slice 1 -->
      <path d="M 0 0 L 0 -45 A 45 45 0 0 1 42 16 Z" fill="#f43f5e"/>
      <!-- Pie slice 2 -->
      <path d="M 0 0 L 42 16 A 45 45 0 0 1 -32 32 Z" fill="#fbbf24"/>
      <!-- Pie slice 3 -->
      <path d="M 0 0 L -32 32 A 45 45 0 0 1 0 -45 Z" fill="#10b981"/>
      <circle cx="0" cy="0" r="14" fill="#0f172a"/>
    </g>
  </g>

  <!-- Big Play Slideshow Emblem (Centered Glow) -->
  <g transform="translate(382, 92)">
    <circle cx="24" cy="24" r="28" fill="url(#goldGradSlides)" stroke="#ffffff" stroke-width="3" filter="url(#shadowFilterSlides)"/>
    <polygon points="18,12 36,24 18,36" fill="#ffffff"/>
  </g>

  <!-- "P" Symbol Identifier Badge at top-left -->
  <g transform="translate(86, 76)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#c2410c" stroke="#ffffff" stroke-width="3" filter="url(#shadowFilterSlides)"/>
    <text x="28" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">P</text>
  </g>

  <!-- Algerian Emblem (Crescent & Star) at bottom-right -->
  <g transform="translate(370, 390) scale(0.68)">
    <circle cx="0" cy="0" r="38" fill="url(#goldGradSlides)" stroke="#ffffff" stroke-width="3" filter="url(#shadowFilterSlides)"/>
    <circle cx="0" cy="0" r="32" fill="#065f46"/>
    <!-- Crescent -->
    <path d="M 10 -16 A 18 18 0 1 0 10 16 A 14 14 0 1 1 10 -16 Z" fill="url(#crimsonRedSlides)"/>
    <!-- Star -->
    <polygon points="12,-5 14,-1 18,-1 15,2 16,6 12,3 8,6 9,2 6,-1 10,-1" fill="url(#crimsonRedSlides)"/>
  </g>
</svg>
