<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f2b6e" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="algeriaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="crimsonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#shieldGrad)" filter="url(#shadowFilter)" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Subtle Internal Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="2">
    <line x1="80" y1="24" x2="80" y2="488" />
    <line x1="160" y1="24" x2="160" y2="488" />
    <line x1="240" y1="24" x2="240" y2="488" />
    <line x1="320" y1="24" x2="320" y2="488" />
    <line x1="400" y1="24" x2="400" y2="488" />
    <line x1="24" y1="120" x2="488" y2="120" />
    <line x1="24" y1="200" x2="488" y2="200" />
    <line x1="24" y1="280" x2="488" y2="280" />
    <line x1="24" y1="360" x2="488" y2="360" />
  </g>

  <!-- Document Page with Folded Corner -->
  <g filter="url(#shadowFilter)">
    <!-- Main page body -->
    <path d="M 120 100 L 320 100 L 392 172 L 392 412 A 16 16 0 0 1 376 428 L 136 428 A 16 16 0 0 1 120 412 Z" fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="3"/>
    
    <!-- Folded Corner -->
    <path d="M 320 100 L 320 160 A 12 12 0 0 0 332 172 L 392 172 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 320 100 L 392 172" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Document Text Lines -->
  <g fill="#94a3b8">
    <rect x="156" y="152" width="130" height="14" rx="7" fill="url(#shieldGrad)"/>
    <rect x="156" y="196" width="200" height="10" rx="5"/>
    <rect x="156" y="228" width="180" height="10" rx="5"/>
    <rect x="156" y="260" width="200" height="10" rx="5"/>
    <rect x="156" y="292" width="150" height="10" rx="5"/>
    <rect x="156" y="324" width="190" height="10" rx="5"/>
    <rect x="156" y="356" width="120" height="10" rx="5"/>
  </g>

  <!-- Golden Calligraphy Nib & Ink Arc -->
  <g transform="translate(40, 20)">
    <!-- Dynamic Writing Arc in Algerian Green -->
    <path d="M 220 370 Q 280 350 330 380 T 400 370" fill="none" stroke="url(#algeriaGreen)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Pen Nib Body -->
    <g transform="translate(320, 260) rotate(-35)">
      <!-- Nib shaft -->
      <path d="M 0 0 L 26 -50 L -26 -50 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
      <rect x="-18" y="-95" width="36" height="50" rx="4" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="2"/>
      <!-- Nib tip slit -->
      <line x1="0" y1="0" x2="0" y2="-24" stroke="#451a03" stroke-width="2.5"/>
      <circle cx="0" cy="-24" r="3.5" fill="#451a03"/>
      <!-- Glowing nib tip point -->
      <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#glowFilter)"/>
    </g>
  </g>

  <!-- Seal Emblem: Algerian Crescent and Star in Gold/Red at bottom right -->
  <g transform="translate(356, 386) scale(0.68)">
    <circle cx="0" cy="0" r="38" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" filter="url(#shadowFilter)"/>
    <circle cx="0" cy="0" r="32" fill="#065f46"/>
    <!-- Crescent -->
    <path d="M 10 -16 A 18 18 0 1 0 10 16 A 14 14 0 1 1 10 -16 Z" fill="url(#crimsonRed)"/>
    <!-- Star -->
    <polygon points="12,-5 14,-1 18,-1 15,2 16,6 12,3 8,6 9,2 6,-1 10,-1" fill="url(#crimsonRed)"/>
  </g>

  <!-- Distinctive "W" Symbol Badge at top-left -->
  <g transform="translate(86, 76)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#2563eb" stroke="#ffffff" stroke-width="3" filter="url(#shadowFilter)"/>
    <text x="28" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">W</text>
  </g>
</svg>
