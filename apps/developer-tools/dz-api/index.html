<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DZ-API Studio | بيئة تطوير واختبار واجهات البرمجة السيادية (بديل Postman & Insomnia)</title>
  <meta name="description" content="منصة متقدمة وسيادية لاختبار وتطوير واستدعاء واجهات البرمجة REST & GraphQL، إدارة المجموعات والبيئات، ومحاكاة الطلبات محلياً 100% دون خوادم سحابية أو تتبع." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light dark" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="./favicon-48x48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
  <!-- Sovereign Offline DZ Runtime Styles & Cairo Typography -->
  <link rel="stylesheet" href="../../../packages/dz-runtime/dz-runtime.css" />
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />
  <link rel="stylesheet" href="./src/styles/shell.css" />
  <link rel="stylesheet" href="./src/styles/editor.css" />
  <link rel="stylesheet" href="./src/styles/response.css" />
  <link rel="stylesheet" href="./src/styles/sidebar.css" />
  <link rel="stylesheet" href="./src/styles/panels.css" />
  <link rel="stylesheet" href="./src/styles/runner.css" />
  <link rel="stylesheet" href="./src/styles/dialogs.css" />
  <link rel="stylesheet" href="./src/styles/websocket.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" />
  <script>
    (() => {
      let t = 'system';
      try { t = JSON.parse(localStorage.getItem('api-client:prefs') || '{}').theme || 'system'; } catch {}
      const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.themeResolved = dark ? 'dark' : 'light';
      document.documentElement.style.background = dark ? '#18181b' : '#ffffff';
    })();
  </script>
  <!-- Native browser Import Map for offline vendored packages -->
  <script type="importmap">
  {
    "imports": {
      "lucide": "../../../packages/vendor/lucide.js"
    }
  }
  </script>
  <!-- Sovereign DZ Runtime (100% Local, zero telemetry) -->
  <script src="../../../packages/dz-runtime/dz-runtime.js"></script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <div id="app" aria-busy="true"></div>
  <noscript>DZ-API Studio needs JavaScript to run.</noscript>
</body>
</html>
