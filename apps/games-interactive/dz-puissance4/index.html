<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DZ-Puissance4 | الرباعية — Puissance 4</title>
  <meta name="description" content="DZ-Puissance4 — الرباعية (Connect Four) بمحرك minimax عميق وثلاث لغات، بدون إنترنت.">
  <meta name="theme-color" content="#008744">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-title">DZ-Puissance4</div>
      <div class="brand-subtitle" data-i18n="subtitle">رباعية الفوز بالأربعة</div>
    </div>
    <div class="topbar-actions">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="ar">ع</button>
        <button class="lang-btn" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button id="themeBtn" class="icon-btn" data-i18n-title="theme" title="المظهر"></button>
      <button id="soundBtn" class="icon-btn" data-i18n-title="sound" title="الصوت"></button>
      <a href="/" class="icon-btn" data-i18n-title="home" title="الرئيسية" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;">🏠</a>
    </div>
  </header>

  <main class="layout">

    <section class="board-zone">
      <div class="status-bar">
        <span id="turnDot" class="turn-dot p1"></span>
        <span id="statusText" class="status-text">…</span>
      </div>

      <div id="board" class="board"></div>

      <div class="controls-row">
        <button id="newGameBtn" class="btn primary" data-i18n="newGame">لعبة جديدة</button>
        <button id="undoBtn" class="btn" data-i18n="undo">تراجع</button>
      </div>
      <div class="hint" data-i18n="hint">انقر على عمود لإسقاط قرصك</div>
    </section>

    <aside class="side-panel">
      <div class="card">
        <div class="field">
          <span data-i18n="vsAi">ضد الحاسوب</span>
          <select id="modeSelect" class="select">
            <option value="ai" data-i18n="vsAi">ضد الحاسوب</option>
            <option value="human" data-i18n="twoPlayers">لاعبان</option>
          </select>
        </div>
        <div class="field" id="colorRow">
          <span data-i18n="playAs">العب بـ</span>
          <select id="colorSelect" class="select">
            <option value="1" data-i18n="red">الأحمر</option>
            <option value="2" data-i18n="yellow">الأصفر</option>
          </select>
        </div>
        <div class="field" id="diffRow">
          <span data-i18n="difficulty">الصعوبة</span>
          <select id="diffSelect" class="select">
            <option value="easy" data-i18n="easy">سهل</option>
            <option value="medium" data-i18n="medium">متوسط</option>
            <option value="hard" data-i18n="hard">صعب</option>
          </select>
        </div>
      </div>
    </aside>
  </main>

  <div id="gameOver" class="banner">
    <div class="banner-card">
      <h2 id="bannerText">—</h2>
      <button id="bannerClose" class="btn primary" data-i18n="newGame">لعبة جديدة</button>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
