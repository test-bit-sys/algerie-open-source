<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DZ-Tawla | طاولة — Backgammon</title>
  <meta name="description" content="DZ-Tawla — طاولة كاملة القواعد (بار، ضرب، إخراج، غمر وفوز كامل) بذكاء اصطناعي وثلاث لغات، بدون إنترنت.">
  <meta name="theme-color" content="#008744">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-title">DZ-Tawla</div>
      <div class="brand-subtitle" data-i18n="subtitle">طاولة — Tawla جزائرية</div>
    </div>
    <div class="topbar-actions">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="ar">ع</button>
        <button class="lang-btn" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button id="themeBtn" class="icon-btn" data-i18n-title="theme" title="المظهر"></button>
      <button id="soundBtn" class="icon-btn" data-i18n-title="sound" title="الصوت"></button>
    </div>
  </header>

  <main class="layout">

    <section class="board-zone">
      <div class="status-bar">
        <span id="statusText" class="status-text">…</span>
        <span class="pip-chip">PIP <b data-i18n="white">W</b>:<b id="pipWhite">167</b> | <b data-i18n="black">B</b>:<b id="pipBlack">167</b></span>
      </div>

      <div class="board-frame">
        <div class="rows">
          <div id="topRow" class="row top"></div>
          <div id="bottomRow" class="row bottom"></div>
        </div>
        <div class="tray-col">
          <div id="blackTray" class="tray black" title="Black off"></div>
          <div id="whiteTray" class="tray white" title="White off"></div>
        </div>
      </div>

      <div class="dice-row">
        <div id="diceZone" class="dice-zone"></div>
        <button id="rollBtn" class="btn primary" data-i18n="roll">ارمِ النرد</button>
        <button id="undoBtn" class="btn" data-i18n="undo">تراجع</button>
        <button id="newGameBtn" class="btn" data-i18n="newGame">لعبة جديدة</button>
      </div>
      <div class="hint" data-i18n="hint">انقر قطعة ثم انقر الوجهة — أو الخانة الخارجية للإخراج</div>
    </section>

    <aside class="side-panel">
      <div class="card">
        <div class="field">
          <span data-i18n="vsAi">ضد الحاسوب</span>
          <select id="modeSelect" class="select">
            <option value="ai" data-i18n="vsAi">ضد الحاسوب</option>
            <option value="human" data-i18n="twoPlayers">لاعبان</option>
          </select>
        </div>
        <div class="field" id="colorRow">
          <span data-i18n="playAs">العب بـ</span>
          <select id="colorSelect" class="select">
            <option value="w" data-i18n="white">الأبيض</option>
            <option value="b" data-i18n="black">الأسود</option>
          </select>
        </div>
        <div class="field" id="diffRow">
          <span data-i18n="difficulty">الصعوبة</span>
          <select id="diffSelect" class="select">
            <option value="easy" data-i18n="easy">سهل</option>
            <option value="medium" data-i18n="medium">متوسط</option>
            <option value="hard" data-i18n="hard">صعب</option>
          </select>
        </div>
      </div>
    </aside>
  </main>

  <div id="gameOver" class="banner">
    <div class="banner-card">
      <h2 id="bannerText">—</h2>
      <button id="bannerClose" class="btn primary" data-i18n="newGame">لعبة جديدة</button>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
