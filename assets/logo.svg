<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1a15" />
      <stop offset="55%" stop-color="#060d11" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>
    
    <radialGradient id="emeraldAura" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#008744" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#008744" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Chrome Bracket Gradients -->
    <linearGradient id="chromeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#008744" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Ruby Crimson Star Gradient -->
    <linearGradient id="rubyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="50%" stop-color="#d21034" />
      <stop offset="100%" stop-color="#800f2f" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- 3D Shadow Filters -->
    <filter id="neonGlowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="rubyLaser" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGlow)" />
  <rect width="1024" height="1024" rx="220" fill="url(#emeraldAura)" />

  <!-- Outer Cyber Hex Shield Ring -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="#008744" stroke-width="2.5" stroke-opacity="0.25" stroke-dasharray="16, 12" />
  <circle cx="512" cy="512" r="395" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12" />
  <circle cx="512" cy="512" r="360" fill="none" stroke="url(#emeraldNeon)" stroke-width="4" stroke-opacity="0.4" filter="url(#neonGlowEmerald)" />

  <!-- Tech Orbital Nodes -->
  <circle cx="512" cy="82" r="8" fill="#00ff88" filter="url(#neonGlowEmerald)" />
  <circle cx="512" cy="942" r="8" fill="#00ff88" filter="url(#neonGlowEmerald)" />
  <circle cx="82" cy="512" r="8" fill="#00ff88" filter="url(#neonGlowEmerald)" />
  <circle cx="942" cy="512" r="8" fill="#00ff88" filter="url(#neonGlowEmerald)" />

  <!-- Isometric Inner Glass Shield -->
  <path d="M512 170 L790 320 L790 680 L512 854 L234 680 L234 320 Z" 
        fill="#0b1319" fill-opacity="0.75" 
        stroke="url(#chromeLeft)" stroke-width="3.5" 
        filter="url(#drop3d)" />

  <!-- Holographic Core Circuit Traces -->
  <path d="M300 400 L420 400 L470 450" fill="none" stroke="#008744" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round" />
  <circle cx="300" cy="400" r="5" fill="#34d399" />
  
  <path d="M724 400 L604 400 L554 450" fill="none" stroke="#008744" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round" />
  <circle cx="724" cy="400" r="5" fill="#34d399" />

  <path d="M512 760 L512 660" fill="none" stroke="#00ff88" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round" />
  <circle cx="512" cy="760" r="6" fill="#00ff88" />

  <!-- ================= MASTER EMBLEM: CODE BRACKETS + DZ CRESCENT & STAR ================= -->

  <!-- Left Futuristic Code Bracket '<' -->
  <path d="M 400 330 
           L 290 490 
           A 30 30 0 0 0 290 534 
           L 400 694 
           L 435 660 
           L 340 512 
           L 435 364 Z" 
        fill="url(#emeraldNeon)" 
        filter="url(#neonGlowEmerald)" />

  <path d="M 395 340 
           L 298 492 
           A 25 25 0 0 0 298 532 
           L 395 684 
           L 415 664 
           L 332 512 
           L 415 360 Z" 
        fill="#ffffff" 
        fill-opacity="0.9" />

  <!-- Right Futuristic Code Bracket '>' -->
  <path d="M 624 330 
           L 734 490 
           A 30 30 0 0 1 734 534 
           L 624 694 
           L 589 660 
           L 684 512 
           L 589 364 Z" 
        fill="url(#emeraldNeon)" 
        filter="url(#neonGlowEmerald)" />

  <path d="M 629 340 
           L 726 492 
           A 25 25 0 0 1 726 532 
           L 629 684 
           L 609 664 
           L 692 512 
           L 609 360 Z" 
        fill="#ffffff" 
        fill-opacity="0.9" />

  <!-- Centerpiece: Algerian Crescent & Star (Sculpted in Ruby Crimson) -->
  <!-- The Crescent -->
  <path d="M 545 385 
           A 135 135 0 1 0 545 639 
           A 108 108 0 1 1 545 385 Z" 
        fill="url(#rubyGlow)" 
        filter="url(#rubyLaser)" />

  <!-- The 5-Pointed Star -->
  <!-- Centered harmoniously in the crescent opening -->
  <polygon points="565,465 579,500 616,502 587,524 597,559 565,539 533,559 543,524 514,502 551,500" 
           fill="url(#rubyGlow)" 
           filter="url(#rubyLaser)" />

  <!-- Inner Pure Light Specular Reflection on Star -->
  <circle cx="565" cy="515" r="9" fill="#ffffff" fill-opacity="0.85" filter="url(#drop3d)" />

  <!-- ================= TYPOGRAPHIC EMBEDDING ================= -->
  <!-- Top Tech Badge -->
  <rect x="422" y="240" width="180" height="34" rx="17" fill="#000000" fill-opacity="0.6" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.7" />
  <text x="512" y="262" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#00ff88" text-anchor="middle" letter-spacing="4">ALGERIA</text>

  <!-- Bottom Brand Text -->
  <text x="512" y="735" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">DZ OPEN SUITE</text>
  <text x="512" y="768" font-family="'Cairo', sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="3">منظومة البرمجيات الجزائرية المفتوحة</text>
  
  <text x="512" y="795" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="5">FREE • SECURE • SOVEREIGN</text>
</svg>
